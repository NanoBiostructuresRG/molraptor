# SPDX-License-Identifier: LGPL-3.0-or-later

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "molraptor"
dynamic = ["version"]
description = "Encode ordered SMILES as traceable Morgan fingerprints using RDKit."
readme = "README.md"
license = "LGPL-3.0-or-later"
license-files = ["LICENSE", "COPYING", "COPYING.LESSER"]
authors = [
    { name = "Flavio F. Contreras-Torres", email = "contreras.flavio@tec.mx" },
]
keywords = [
    "cheminformatics",
    "molecular fingerprints",
    "Morgan fingerprints",
    "RDKit",
    "drug discovery",
    "machine learning",
    "computational chemistry",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4",
    "pandas>=1.5",
    "pydantic>=2.11",
    "rdkit>=2024.9.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "build>=1.0",
    "hatchling>=1.18",
    "twine>=4.0",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]

[project.urls]
Homepage = "https://github.com/NanoBiostructuresRG/molraptor"
Repository = "https://github.com/NanoBiostructuresRG/molraptor"
Issues = "https://github.com/NanoBiostructuresRG/molraptor/issues"
Documentation = "https://nanobiostructuresrg.github.io/molraptor/"

[project.scripts]
molraptor = "molraptor.cli:main"

[tool.hatch.version]
path = "molraptor/version.py"

[tool.hatch.build.targets.wheel]
packages = ["molraptor"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.git",
    "/.github",
    "/.mypy_cache",
    "/.pytest_cache",
    "/.ruff_cache",
    "/.venv",
    "/__pycache__",
    "*/__pycache__",
    "*.egg-info",
    "/*.egg-info",
    "/build",
    "/dist",
    "/docs",
    "/mkdocs.yml",
    "/data",
    "/artifacts",
    "/logs",
    "/configs",
    "/site",
    "/htmlcov",
    "/.coverage",
    "/test_output.txt",
    "*.pyc",
    "*.pyo",
    "*.npy",
    "*.npz",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
tmp_path_retention_count = 0
tmp_path_retention_policy = "none"
